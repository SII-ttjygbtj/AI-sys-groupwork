resources:
  accelerators: tpu-v6e-4 # 加速器类型（4个TPU芯片，支持TP=4）
  accelerator_args:
    tpu_vm: True
    runtime_version: v2-alpha-tpuv6e # 可选
file_mounts:
  ~/.ssh/id_rsa: ~/.ssh/id_rsa # 挂载本地 SSH 密钥
setup: |
  chmod 600 ~/.ssh/id_rsa # 设置密钥权限
  rm ~/.ssh/config # 删除原有配置
  # 克隆代码仓库（跳过主机密钥验证）
  GIT_SSH_COMMAND="ssh -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no" git clone git@github.com:Furion-cn/sgl-jax.git
  # 安装依赖
  cd /home/gcpuser/sky_workdir/sgl-jax && uv pip install -e python/
  # 安装bonsai（如果还没有）
  # pip install -e /path/to/bonsai

# 运行命令：TP=1测试
# run: |
#   cd /home/gcpuser/sky_workdir/sgl-jax
#   TP_SIZE=1 JAX_COMPILATION_CACHE_DIR=/tmp/jit_cache \
#   python -u -m sgl_jax.launch_server \
#     --model-path /home/gcpuser/AI-sys-groupwork/sglang_jax/gpt-oss-20b \
#     --engine-type jax \
#     --trust-remote-code \
#     --skip-server-warmup \
#     --dist-init-addr=0.0.0.0:10011 \
#     --nnodes=1 \
#     --tp-size=1 \
#     --device=tpu \
#     --random-seed=3 \
#     --node-rank=0 \
#     --mem-fraction-static=0.6 \
#     --max-prefill-tokens=4096 \
#     --download-dir=/tmp/ \
#     --kv-cache-dtype=bf16 \
#     --dtype=bfloat16

# 运行命令：TP=4测试（取消注释启用）
# run: |
#   cd /home/gcpuser/sky_workdir/sgl-jax
#   TP_SIZE=4 JAX_COMPILATION_CACHE_DIR=/tmp/jit_cache \
#   python -u -m sgl_jax.launch_server \
#     --model-path /home/gcpuser/AI-sys-groupwork/sglang_jax/gpt-oss-20b \
#     --engine-type jax \
#     --trust-remote-code \
#     --skip-server-warmup \
#     --dist-init-addr=0.0.0.0:10011 \
#     --nnodes=1 \
#     --tp-size=4 \
#     --device=tpu \
#     --random-seed=3 \
#     --node-rank=0 \
#     --mem-fraction-static=0.6 \
#     --max-prefill-tokens=4096 \
#     --download-dir=/tmp/ \
